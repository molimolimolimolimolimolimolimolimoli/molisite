<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moli</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="initMedia()">
    <div class="custom-cursor"></div>

    <div id="start-screen">
        <div id="start-text"></div>
        <div id="start-click">[CLICK]</div>
    </div>

    <div class="container">
        <video id="background" autoplay loop muted playsinline webkit-playsinline>
            <source src="assets/background.mp4" type="video/mp4">
        </video>

        <div class="vignette-overlay"></div>
        <div class="tv-overlay"></div>

        <div class="top-controls glass">
            <div class="volume-control">
                <svg id="volume-icon" class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
                <input id="volume-slider" class="slider" type="range" min="0" max="1" step="0.01" value="0.3">
            </div>
        </div>

        <div id="card-stack">
            <div id="profile-card" class="glass hidden">
                <div class="card-top-row">
                    <a href="https://moliguestbook.xyz" target="_blank" class="avatar-wrap" aria-label="Guestbook">
                        <img src="assets/avatar.webp" alt="Profile" class="avatar">
                    </a>

                    <div class="stats-row">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                        <span id="visitor-count"></span>
                    </div>
                </div>

                <div class="profile-info">
                    <span id="profile-name"></span>
                    <div id="profile-bio"></div>
                </div>

                <div class="social-links">
                    <span class="social-icon wing-icon" title="@cool.moli dc">
                        <img src="assets/wing-left.webp" alt="" draggable="false">
                    </span>
                    <a href="https://open.spotify.com/playlist/6ktKz3gjwCFHyYQVcIRTr6?si=a33479ddd3f2485a" target="_blank" aria-label="Spotify">
                        <svg class="social-icon spotify-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.1-10.561-1.16-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02v.019zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.36.181.54.78.24 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.72-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"></path>
                        </svg>
                    </a>
                    <a href="https://discord.gg/brush/" target="_blank" aria-label="Discord">
                        <img class="social-icon wing-icon" src="assets/wing-right.webp" alt="Discord invite" draggable="false">
                    </a>
                </div>
            </div>

            <div id="audio-player-card" class="glass hidden">
                <div class="track-cover">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"></path>
                    </svg>
                </div>
                <div class="track-info">
                    <div class="track-title-row">
                        <span id="track-title"></span>
                        <span id="now-playing-bars" class="eq-bars hidden" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </span>
                    </div>
                    <div class="audio-progress-row">
                        <span id="time-current">0:00</span>
                        <div class="audio-progress" id="audio-progress">
                            <div id="audio-progress-fill"></div>
                        </div>
                        <span id="time-total">0:00</span>
                        <div class="audio-controls">
                            <button id="prev-track" class="control-btn" aria-label="Previous track">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L10 12l10 6V6z"></path></svg>
                            </button>
                            <button id="play-pause" class="control-btn control-btn-main" aria-label="Play or pause">
                                <svg id="play-pause-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                            </button>
                            <button id="next-track" class="control-btn" aria-label="Next track">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6l10 6-10 6V6zM16 6h2v12h-2z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="afk-overlay">
            <div id="afk-clock">00:00:00</div>
            <div id="afk-label">still there? :(</div>
        </div>

        <div id="cava-bars" class="cava-bars"></div>
    </div>

    <audio id="audio-player-el"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
